
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. 检查初始磁盘空间
      # ============================================================
      - name: Before freeing up disk space
        run: |
          echo "========== Before cleanup =========="
          df -hT
          echo "========== Inodes =========="
          df -i
          echo "========== Docker disk usage =========="
          docker system df || true

      # ============================================================
      # 2. 释放 GitHub Runner 磁盘空间
      # ============================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/var/lib/docker/'

      # ============================================================
      # 3. 重启 Docker
      # ============================================================
      - name: Restart Docker
        run: |
          sudo service docker restart
          sleep 5
          docker info
          echo "Docker restarted successfully"

      # ============================================================
      # 4. 检查磁盘空间
      # ============================================================
      - name: Check disk space after cleanup
        run: |
          echo "========== Root filesystem =========="
          df -hT /
          echo "========== Docker filesystem =========="
          df -hT /var/lib/docker
          echo "========== Runner filesystem =========="
          df -hT /home/runner
          echo "========== Inodes =========="
          df -i
          echo "========== Docker usage =========="
          docker system df

      # ============================================================
      # 5. 拉取代码
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ============================================================
      # 6. 检查镜像列表
      # ============================================================
      - name: Validate images list
        run: |
          if [ ! -f images.txt ]; then
            echo "ERROR: images.txt does not exist"
            exit 1
          fi

          echo "========== Image count =========="
          grep -vE '^[[:space:]]*(#|$)' images.txt | wc -l

          echo "========== Image list =========="
          cat images.txt

      # ============================================================
      # 7. 登录阿里云镜像仓库
      # ============================================================
      - name: Docker Login Aliyun
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | \
            docker login \
              -u "$ALIYUN_REGISTRY_USER" \
              --password-stdin "$ALIYUN_REGISTRY"

      # ============================================================
      # 8. Pull / Tag / Push 镜像
      # ============================================================
      - name: Build and push image Aliyun
        shell: bash
        run: |
          set -Eeuo pipefail

          # --------------------------------------------------------
          # 定义磁盘检查函数
          # --------------------------------------------------------
          check_disk() {
            echo "========== Disk usage =========="
            df -hT /
            df -hT /var/lib/docker
            df -i
            docker system df || true
          }

          # --------------------------------------------------------
          # 定义清理函数
          # --------------------------------------------------------
          cleanup_image() {
            local source_image="${1:-}"
            local target_image="${2:-}"

            echo "开始清理当前镜像"

            if [[ -n "$source_image" ]]; then
              docker rmi "$source_image" || true
            fi

            if [[ -n "$target_image" ]]; then
              docker rmi "$target_image" || true
            fi

            # 清理不再使用的镜像层
            docker image prune -af || true

            echo "当前镜像清理完成"
            check_disk
          }

          # --------------------------------------------------------
          # 预处理：判断镜像是否重名
          # --------------------------------------------------------
          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [[ -n "$line" ]]; do

            # 忽略空行与注释
            [[ -z "${line//[[:space:]]/}" ]] && continue

            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            # 获取镜像完整名称
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            echo "image: $image"

            # 获取镜像名:版本号
            image_name_tag="${image##*/}"

            # 获取命名空间
            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            name_space="${name_space}_"

            # 获取镜像名称
            image_name="${image_name_tag%%:*}"

            echo "image_name: $image_name"
            echo "name_space: $name_space"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then

              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi

            else
              temp_map[$image_name]="$name_space"
            fi

          done < images.txt

          # --------------------------------------------------------
          # 逐个拉取并推送镜像
          # --------------------------------------------------------
          while IFS= read -r line || [[ -n "$line" ]]; do

            # 忽略空行与注释
            [[ -z "${line//[[:space:]]/}" ]] && continue

            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            echo ""
            echo "=================================================="
            echo "开始处理镜像: $line"
            echo "=================================================="

            # 获取镜像完整名称
            image=$(echo "$line" | awk '{print $NF}')

            # 去掉 digest
            image="${image%%@*}"

            new_image=""

            # 出错时也尝试清理当前镜像
            trap 'cleanup_image "$image" "$new_image"' ERR

            # 检查磁盘
            check_disk

            # 拉取镜像
            echo "docker pull $line"
            docker pull $line

            # 获取平台架构
            platform=$(echo "$line" | awk -F'--platform[ =]' \
              '{if (NF>1) print $2}' | awk '{print $1}')

            echo "platform: $platform"

            if [[ -z "$platform" ]]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            echo "platform_prefix: $platform_prefix"

            # 获取镜像名称和 Tag
            image_name_tag="${image##*/}"

            # 获取命名空间
            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            image_name="${image_name_tag%%:*}"

            name_space_prefix=""

            # 判断镜像名是否重名
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
              if [[ -n "$name_space" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            # 构造阿里云镜像名称
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "源镜像: $image"
            echo "目标镜像: $new_image"

            # Tag
            docker tag "$image" "$new_image"

            # Push
            echo "开始推送: $new_image"
            docker push "$new_image"

            echo "镜像推送成功: $new_image"

            # 清理当前镜像
            cleanup_image "$image" "$new_image"

            # 取消错误清理陷阱
            trap - ERR

            echo "镜像处理完成: $image"

          done < images.txt

          echo ""
          echo "=================================================="
          echo "所有镜像处理完成"
          echo "=================================================="

          check_disk

      # ============================================================
      # 9. 最终清理
      # ============================================================
      - name: Final Docker cleanup
        if: always()
        run: |
          echo "========== Final cleanup =========="

          docker image prune -af || true
          docker builder prune -af || true

          echo "========== Final disk usage =========="
          df -hT
          df -i
          docker system df || true
